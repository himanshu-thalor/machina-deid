[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-deid"
version = "0.1.0"
description = "Reproducible CAD & engineering corpus de-identification pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pikepdf>=9.0.0",
    "ezdxf>=1.3.0",
    "olefile>=0.47",
    "lxml>=5.2.0",
    "Pillow>=10.3.0",
    "py7zr>=1.1.4",
    "pyahocorasick>=2.3.1",
    "rarfile>=4.2",
    "numpy>=1.26.0",
    "rapidocr>=2.0.0",
    "onnxruntime>=1.20.0",
]

[project.scripts]
machina-deid = "machina_deid.cli:main"
